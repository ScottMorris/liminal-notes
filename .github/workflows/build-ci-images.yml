name: build-ci-images

on:
  push:
    branches:
      - main
      - feat/ci-shared-image-desktop-android
    paths:
      - "docker/ci/Dockerfile.ci-base"
      - ".github/workflows/build-ci-images.yml"
  workflow_dispatch:

concurrency:
  group: build-ci-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.image_suffix }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: desktop
            target: desktop
            platforms: linux/amd64,linux/arm64
          - image_suffix: android
            target: android
            platforms: linux/amd64
          - image_suffix: test
            target: test
            platforms: linux/amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/liminal-notes-ci-base-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile.ci-base
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/liminal-notes-ci-base-${{ matrix.image_suffix }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/liminal-notes-ci-base-${{ matrix.image_suffix }}:buildcache,mode=max
          platforms: ${{ matrix.platforms }}

      - name: Write build summary
        run: |
          echo "## Built image: ${{ matrix.image_suffix }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Target: \`${{ matrix.target }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Platforms: \`${{ matrix.platforms }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: \`ghcr.io/${{ github.repository_owner }}/liminal-notes-ci-base-${{ matrix.image_suffix }}\`" >> "${GITHUB_STEP_SUMMARY}"
